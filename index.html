<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 😈</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background: radial-gradient(circle, #ff7aa2, #ff3d7f);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: center;
    overflow: hidden;
    color: white;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 25px;
  }

  .buttons {
    display: flex;
    gap: 18px;
  }

  button {
    font-size: 1.2rem;
    padding: 16px 26px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.25s ease;
  }

  #yes {
    background: #ff0055;
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  #no {
    background: #555;
    color: white;
  }

  .shake {
    animation: shake 0.35s;
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
  }

  .heart {
    position: absolute;
    font-size: 1.5rem;
    animation: floatUp 2.5s linear forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    from {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    to {
      opacity: 0;
      transform: translateY(-120px) scale(1.8);
    }
  }
</style>
</head>

<body>

<h1>Will you be my Valentine? 💘</h1>

<div class="buttons">
  <button id="yes">Yes 💖</button>
  <button id="no">No 😒</button>
</div>

<script>
let noClicks = 0;

const messages = [
  "Are you sure? 🤨",
  "Really sure?? 😳",
  "Pretty please 🥹",
  "better click yes hoe🌝",
  "Last chance 😭"
];

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

function spawnHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerText = "💘";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "20px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 2500);
}

noBtn.onclick = () => {
  noClicks++;

  if (messages[noClicks - 1]) {
    noBtn.innerText = messages[noClicks - 1];
  }

  yesBtn.style.transform = `scale(${1 + noClicks * 0.6})`;

  noBtn.classList.add("shake");
  setTimeout(() => noBtn.classList.remove("shake"), 350);

  spawnHeart();
};

yesBtn.onclick = () => {
  document.body.innerHTML = `
    <div style="
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      font-size:3rem;
      background:black;
      color:#ff3d7f;
    ">
      good girl 😈
    </div>
  `;
};
</script>

</body>
</html>
